<!DOCTYPE html>
<html lang="zh-CN" style="background: transparent;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便签</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: transparent !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    .sticky-note {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border-radius: 8px;
      overflow: hidden;
      background: #fff9c4;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      /* Windows 透明窗口圆角修复 */
      -webkit-mask-image: -webkit-radial-gradient(white, black);
    }

    /* 标题栏 - 可拖拽 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: #fff176;
      -webkit-app-region: drag;
      cursor: move;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #5d4037;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .header-actions button {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s;
      background: rgba(0,0,0,0.08);
      color: #5d4037;
    }

    .header-actions button:hover {
      background: rgba(0,0,0,0.15);
    }

    .btn-pin.pinned {
      background: #ff8a65;
      color: #fff;
    }

    .btn-close:hover {
      background: #ef5350 !important;
      color: #fff;
    }

    /* 统计信息 */
    .stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 14px 8px;
      font-size: 11px;
      color: #8d6e63;
      border-bottom: 1px dashed #e6d77a;
      flex-shrink: 0;
    }

    .stats-text {
      flex: 1;
    }

    .btn-toggle-completed {
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: transparent;
      color: #bcaaa4;
      transition: all 0.2s;
      flex-shrink: 0;
      margin-left: 6px;
    }

    .btn-toggle-completed:hover {
      background: rgba(0,0,0,0.08);
    }

    .btn-toggle-completed.active {
      color: #66bb6a;
    }

    .btn-toggle-completed.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 待办列表 */
    .todo-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
    }

    .todo-list::-webkit-scrollbar {
      width: 4px;
    }

    .todo-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .todo-list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      transition: background 0.15s;
    }

    .todo-item:hover {
      background: rgba(0, 0, 0, 0.03);
      border-radius: 4px;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-checkbox {
      width: 16px;
      height: 16px;
      border: 2px solid #bcaaa4;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .todo-checkbox:hover {
      border-color: #8d6e63;
      background: rgba(141, 110, 99, 0.1);
    }

    .todo-checkbox.checked {
      background: #a5d6a7;
      border-color: #66bb6a;
    }

    .todo-checkbox.checked::after {
      content: "\2713";
      font-size: 10px;
      color: #fff;
      font-weight: bold;
    }

    .todo-content {
      flex: 1;
      min-width: 0;
    }

    .todo-title {
      font-size: 13px;
      color: #4e342e;
      line-height: 1.4;
      word-break: break-word;
    }

    .todo-title.completed {
      text-decoration: line-through;
      color: #a1887f;
    }

    .todo-desc {
      font-size: 11px;
      color: #8d6e63;
      margin-top: 2px;
      line-height: 1.3;
      word-break: break-word;
    }

    .todo-meta {
      display: flex;
      gap: 8px;
      margin-top: 3px;
      flex-wrap: wrap;
    }

    .todo-badge {
      font-size: 10px;
      color: #a1887f;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .todo-badge.overdue {
      color: #e53935;
    }

    .todo-badge.starred {
      color: #ffa000;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #bcaaa4;
      font-size: 13px;
      gap: 8px;
    }

    .empty-state .icon {
      font-size: 32px;
    }

    /* 暗色模式 */
    @media (prefers-color-scheme: dark) {
      .sticky-note {
        background: #37474f;
      }

      .header {
        background: #455a64;
      }

      .header-title {
        color: #eceff1;
      }

      .header-actions button {
        background: rgba(255, 255, 255, 0.1);
        color: #eceff1;
      }

      .header-actions button:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .btn-pin.pinned {
        background: #ff8a65;
        color: #fff;
      }

      .btn-close:hover {
        background: #ef5350 !important;
        color: #fff;
      }

      .stats {
        color: #90a4ae;
        border-bottom-color: rgba(255, 255, 255, 0.1);
      }

      .btn-toggle-completed {
        color: #78909c;
      }

      .btn-toggle-completed:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .btn-toggle-completed.active {
        color: #66bb6a;
      }

      .todo-item {
        border-bottom-color: rgba(255, 255, 255, 0.05);
      }

      .todo-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      .todo-checkbox {
        border-color: #78909c;
      }

      .todo-checkbox:hover {
        border-color: #b0bec5;
        background: rgba(176, 190, 197, 0.1);
      }

      .todo-checkbox.checked {
        background: #66bb6a;
        border-color: #43a047;
      }

      .todo-title {
        color: #eceff1;
      }

      .todo-title.completed {
        color: #78909c;
      }

      .todo-desc {
        color: #90a4ae;
      }

      .todo-badge {
        color: #78909c;
      }

      .todo-badge.overdue {
        color: #ef5350;
      }

      .empty-state {
        color: #78909c;
      }

      .todo-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
      }
    }
  </style>
</head>
<body>
  <div class="sticky-note">
    <div class="header">
      <span class="header-title" id="title">便签</span>
      <div class="header-actions">
        <button class="btn-pin pinned" id="btnPin" title="置顶">&#x1F4CC;</button>
        <button class="btn-close" id="btnClose" title="关闭">&#x2715;</button>
      </div>
    </div>
    <div class="stats">
      <span class="stats-text" id="statsText"></span>
      <button class="btn-toggle-completed" id="btnToggleCompleted" title="显示已完成事项">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
      </button>
    </div>
    <div class="todo-list" id="todoList"></div>
  </div>

  <script>
    let isPinned = true
    let showCompleted = false
    let currentData = null

    // 监听 preload 发出的数据就绪事件
    window.addEventListener('sticky-data-ready', (e) => {
      currentData = e.detail
      // completed 筛选下强制显示已完成
      if (currentData.filter === 'completed') {
        showCompleted = true
      }
      updateToggleButton()
      renderNote()
    })

    // 置顶按钮
    document.getElementById('btnPin').addEventListener('click', () => {
      isPinned = !isPinned
      const btn = document.getElementById('btnPin')
      btn.classList.toggle('pinned', isPinned)
      window.stickyNote.togglePin(isPinned)
    })

    // 关闭按钮
    document.getElementById('btnClose').addEventListener('click', () => {
      window.stickyNote.closeWindow()
    })

    // 显示/隐藏已完成按钮
    document.getElementById('btnToggleCompleted').addEventListener('click', () => {
      if (currentData && currentData.filter === 'completed') return
      showCompleted = !showCompleted
      updateToggleButton()
      renderNote()
    })

    function updateToggleButton() {
      var btn = document.getElementById('btnToggleCompleted')
      var isCompletedFilter = currentData && currentData.filter === 'completed'
      btn.classList.toggle('active', showCompleted)
      btn.classList.toggle('disabled', isCompletedFilter)
      btn.title = isCompletedFilter
        ? '\u5DF2\u5B8C\u6210\u8FC7\u6EE4\u5668\u4E0B\u5FC5\u987B\u663E\u793A\u5DF2\u5B8C\u6210\u4E8B\u9879'
        : showCompleted ? '\u9690\u85CF\u5DF2\u5B8C\u6210\u4E8B\u9879' : '\u663E\u793A\u5DF2\u5B8C\u6210\u4E8B\u9879'
    }

    // 渲染便签
    function renderNote() {
      if (!currentData) return
      var title = currentData.title
      var todos = currentData.todos
      var completedCount = currentData.completedCount
      var pendingCount = currentData.pendingCount

      // 根据 showCompleted 过滤显示
      var displayTodos = showCompleted ? todos : todos.filter(function(t) { return !t.completedAt })

      document.getElementById('title').textContent = title

      // 统计信息
      document.getElementById('statsText').textContent =
        '\u5F85\u5B8C\u6210 ' + pendingCount + ' \u9879' + (completedCount > 0 ? ' \xB7 \u5DF2\u5B8C\u6210 ' + completedCount + ' \u9879' : '')

      const listEl = document.getElementById('todoList')

      if (displayTodos.length === 0) {
        listEl.innerHTML =
          '<div class="empty-state">' +
            '<span class="icon">&#x1F389;</span>' +
            '<span>\u6682\u65E0\u5F85\u529E\u4E8B\u9879</span>' +
          '</div>'
        return
      }

      listEl.innerHTML = ''
      displayTodos.forEach(function(todo) {
        var item = document.createElement('div')
        item.className = 'todo-item'

        // Checkbox
        var checkbox = document.createElement('div')
        checkbox.className = 'todo-checkbox' + (todo.completed ? ' checked' : '')
        checkbox.addEventListener('click', function() {
          window.stickyNote.toggleTodoStatus(todo.id)
        })

        // Content
        var content = document.createElement('div')
        content.className = 'todo-content'

        var titleEl = document.createElement('div')
        titleEl.className = 'todo-title' + (todo.completed ? ' completed' : '')
        titleEl.textContent = todo.title
        content.appendChild(titleEl)

        if (todo.description) {
          var desc = document.createElement('div')
          desc.className = 'todo-desc'
          desc.textContent = todo.description
          content.appendChild(desc)
        }

        // Meta badges
        var meta = document.createElement('div')
        meta.className = 'todo-meta'

        if (todo.starred) {
          var star = document.createElement('span')
          star.className = 'todo-badge starred'
          star.innerHTML = '&#x2B50; \u6536\u85CF'
          meta.appendChild(star)
        }

        if (todo.dueDate) {
          var due = document.createElement('span')
          var dueDate = new Date(todo.dueDate)
          var now = new Date()
          var isOverdue = !todo.completed && dueDate < now
          due.className = 'todo-badge' + (isOverdue ? ' overdue' : '')
          due.textContent = (isOverdue ? '\u26A0 ' : '\uD83D\uDCC5 ') + formatDate(dueDate)
          meta.appendChild(due)
        }

        if (todo.reminderTime && !todo.dueDate) {
          var reminder = document.createElement('span')
          reminder.className = 'todo-badge'
          reminder.textContent = '\u23F0 ' + formatDate(new Date(todo.reminderTime))
          meta.appendChild(reminder)
        }

        if (meta.children.length > 0) {
          content.appendChild(meta)
        }

        item.appendChild(checkbox)
        item.appendChild(content)
        listEl.appendChild(item)
      })
    }

    function formatDate(date) {
      var now = new Date()
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate())
      var target = new Date(date.getFullYear(), date.getMonth(), date.getDate())
      var diff = (target - today) / (1000 * 60 * 60 * 24)

      var time = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })

      if (diff === 0) return '\u4ECA\u5929 ' + time
      if (diff === 1) return '\u660E\u5929 ' + time
      if (diff === -1) return '\u6628\u5929 ' + time
      return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + time
    }
  </script>
</body>
</html>
